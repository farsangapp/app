name: Farsang

options:
  bundleIdPrefix: dev.djawadi
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # The shared `Farsang` scheme is the build-and-test entry point. A launch
  # runnable would pin its destinations to one platform, so CI could not build
  # the watch app and test on an iPhone simulator with the same scheme. Strip
  # it; use the FarsangPhone and FarsangWatch schemes to run an app.
  postGenCommand: >-
    perl -0pi -e 's{<BuildableProductRunnable.*?</BuildableProductRunnable>\s*}{}gs'
    Farsang.xcodeproj/xcshareddata/xcschemes/Farsang.xcscheme

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES

packages:
  FarsangCore:
    path: Packages/FarsangCore
  FarsangUI:
    path: Packages/FarsangUI

targets:
  Farsang:
    type: application
    platform: iOS
    sources:
      - Apps/iPhone
    dependencies:
      - package: FarsangCore
      - package: FarsangUI
      - target: FarsangWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.djawadi.farsang
        PRODUCT_NAME: Farsang
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Farsang
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

  FarsangWatch:
    type: application
    platform: watchOS
    sources:
      - Apps/Watch
    dependencies:
      - package: FarsangCore
      - package: FarsangUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.djawadi.farsang.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_KEY_CFBundleDisplayName: Farsang
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: dev.djawadi.farsang
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES

  # Throwaway spike for FAR-8 (docs/spikes/map-and-speech.md). Watch-only, own bundle id, never shipped:
  # it is not part of the Farsang scheme, so it stays out of that scheme's build and archive.
  FarsangSpike:
    type: application
    platform: watchOS
    sources:
      - Apps/Spike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.djawadi.farsang.spike
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_KEY_CFBundleDisplayName: Farsang Spike
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Shows your position on the map for the offline map test.

schemes:
  Farsang:
    build:
      targets:
        Farsang: all
        FarsangWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: FarsangCore/FarsangCoreTests
        - package: FarsangUI/FarsangUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  FarsangPhone:
    build:
      targets:
        Farsang: all
        FarsangWatch: all
    run:
      config: Debug
      executable: Farsang
  FarsangWatch:
    build:
      targets:
        FarsangWatch: all
    run:
      config: Debug
      executable: FarsangWatch
  FarsangSpike:
    build:
      targets:
        FarsangSpike: all
    run:
      config: Debug
      executable: FarsangSpike
